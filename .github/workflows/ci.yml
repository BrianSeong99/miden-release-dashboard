name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:coverage
      - run: npm run build
        env:
          # Optional: raises rate limits for the prebuild config check only;
          # the build itself makes no GitHub calls.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
