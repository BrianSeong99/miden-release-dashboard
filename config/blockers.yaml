# Critical blockers for Miden v0.16 — manually curated, live state fetched
# from GitHub at refresh time. Every entry REQUIRES owner, exitCondition and
# nextDecisionDate; the build fails otherwise (scripts/validate-config.ts).
#
# Severity `critical` turns its stage red on the dependency graph.
# Seeded 2026-08-31 from release coordination; owners/dates are drafts for
# the release driver to confirm.

blockers:
  - id: protocol-fee-guarded-multisig
    title: "Guarded multisig auth must pay the transaction fee (0.16 backport)"
    severity: critical
    release: "0.16"
    stage: protocol
    blockingDependency: "Guardian accounts paying fees"
    owner: "Wiktor"
    exitCondition: "PR merged into release/v0.16.0-rc and shipped in the next 0.16 RC"
    nextDecisionDate: "2026-09-03"
    github: { repo: 0xMiden/protocol, number: 3765 }

  - id: protocol-faucet-fee-asset
