# Miden release monitoring configuration.
# Verified against live GitHub + network state on 2026-09-02.
#
# The dashboard renders one release at a time (switcher in the header);
# `defaultRelease` is what loads first. NOTE the per-component `branch`:
# a train does not always live on the default branch (protocol keeps 0.16 on
# release/v0.16.0-rc; web-sdk and wallet keep it on next). `targetTrain` on a
# detector overrides the release-wide target when the dependency runs its own
# version train (miden-vm 0.29.x feeds protocol 0.16; Guardian 0.17.x feeds
# wallet 1.16).

defaultRelease: "0.16"

environments:
  - id: devnet
    label: "DevNet"
    statusUrl: https://status.devnet.miden.io/status
    expectedComponentId: node
  - id: testnet
    label: "Testnet"
    statusUrl: https://status.testnet.miden.io/status
    expectedComponentId: node

releases:
  # ---- Past release: everything shipped; release tags are the evidence. ----
  # Manifest detectors are omitted where the live branch has already moved on
  # to the next train (they would only add noise to a settled release).
  - name: "Miden v0.15"
    targetVersion: "0.15"
    targetDate: null
    components:
      - id: vm
        label: "Miden VM"
        repo: 0xMiden/miden-vm
        branch: next
        owner: "VM team"
        expectedVersion: "0.23.0" # protocol 0.15 consumed the VM 0.23 train
        group: chain
        detectors:
          - type: github-release
      - id: protocol
        label: "Protocol"
        repo: 0xMiden/protocol
        branch: main
        owner: "Protocol team"
        expectedVersion: "0.15.0"
        group: chain
        dependsOn: [vm]
        detectors:
          - type: github-release
      - id: node
        label: "Node"
        repo: 0xMiden/node
        branch: next
        owner: "Node team"
        expectedVersion: "0.15.0"
        group: chain
        dependsOn: [protocol]
        detectors:
          - type: github-release
      - id: rust-sdk
        label: "Rust SDK"
        repo: 0xMiden/rust-sdk
        branch: next
        owner: "Wiktor"
        expectedVersion: "0.15.0"
        group: sdk
        dependsOn: [protocol, node]
        detectors:
          - type: github-release
      - id: web-sdk
        label: "Web SDK"
        repo: 0xMiden/web-sdk
        branch: main
        owner: "Wiktor"
        expectedVersion: "0.15.0"
        group: sdk
        dependsOn: [protocol, node]
        detectors:
          - type: github-release
      - id: guardian
        label: "Guardian"
        repo: OpenZeppelin/guardian
        branch: main
        owner: "OpenZeppelin"
        expectedVersion: "0.16.0" # Guardian's train that pairs with Miden 0.15
        group: app
        dependsOn: [rust-sdk, web-sdk]
        detectors:
          - type: github-release
      - id: wallet
        label: "Wallet"
        repo: 0xMiden/wallet
        branch: main
        owner: "Wiktor"
        expectedVersion: "1.15.0"
        group: app
        dependsOn: [web-sdk, guardian]
        detectors:
          - type: github-release
      - id: docs
        label: "Docs"
        repo: 0xMiden/docs
        branch: main
        owner: "Brian"
        expectedVersion: "0.15"
        group: devex
        dependsOn: [rust-sdk, web-sdk]
        detectors:
          - type: yaml-manifest
            path: .release/release-manifest.yml
            key: version # the published docs version (next_version tracks 0.16)
      - id: tutorials
        label: "Tutorials"
        repo: 0xMiden/tutorials
        branch: main
        owner: "Philipp"
        expectedVersion: "0.15"
        group: devex
        dependsOn: [rust-sdk, web-sdk]
        detectors:
          - type: cargo-dep
            path: rust-client/Cargo.toml
            dependency: miden-client
            provesComponent: rust-sdk
            targetTrain: "0.15"
          - type: npm-dep
            path: web-client/package.json
            dependency: "@miden-sdk/miden-sdk"
            provesComponent: web-sdk
            targetTrain: "0.15"
      - id: frontend-template
        label: "Frontend template"
        repo: 0xMiden/frontend-template
        branch: main
        owner: "Philipp"
        expectedVersion: "0.15"
        group: devex
        dependsOn: [web-sdk]
        detectors:
          - type: npm-dep
            dependency: "@miden-sdk/miden-sdk"
            provesComponent: web-sdk
            targetTrain: "0.15"
      - id: project-template
        label: "Project template"
        repo: 0xMiden/project-template
        branch: main
        owner: "Roman"
        expectedVersion: "0.15"
        group: devex
        dependsOn: [rust-sdk]
        detectors:
          - type: cargo-dep
            path: integration/Cargo.toml
            dependency: miden-client
            provesComponent: rust-sdk
            targetTrain: "0.15"
      - id: agentic-template
        label: "Agentic template"
        repo: 0xMiden/agentic-template
        branch: main
        owner: "Philipp"
        expectedVersion: "0.15"
        group: devex
        dependsOn: [frontend-template, project-template]
        detectors:
          - type: submodule-dep
            submodulePath: frontend-template
            sourceRepo: 0xMiden/frontend-template
            manifest: npm
            path: package.json
            dependency: "@miden-sdk/miden-sdk"
            provesComponent: web-sdk
            targetTrain: "0.15"
          - type: submodule-dep
            submodulePath: project-template
            sourceRepo: 0xMiden/project-template
            manifest: cargo
            path: integration/Cargo.toml
            dependency: miden-client
            provesComponent: rust-sdk
            targetTrain: "0.15"
      - id: midenup
        label: "midenup"
        repo: 0xMiden/midenup
        branch: main
        owner: "Roman"
        expectedVersion: "0.15"
        group: devex
        dependsOn: [rust-sdk, node]
        detectors:
          - type: midenup-channel
            channel: "0.15.0"
            component: client
            provesComponent: rust-sdk
            targetTrain: "0.15"
          - type: midenup-channel
            channel: "0.15.0"
            component: node
            provesComponent: node
            targetTrain: "0.15"

      # ---- Walnut surfaces (rolled up into one stage in the UI). No releases
      # or tags on these repos; version comes from manifests on main. NOTE:
      # never infer the Miden train from @openzeppelin/miden-multisig-client —
      # it is versioned independently (0.16.x while the SDK sat on 0.15).
      - id: playground
        label: "Playground"
        repo: walnuthq/miden-playground
        branch: main
        owner: "Walnut"
        expectedVersion: "0.15"
        group: walnut
        dependsOn: [web-sdk]
        detectors:
          - type: npm-dep
            path: apps/web/package.json
            dependency: "@miden-sdk/miden-sdk"
            provesComponent: web-sdk
            targetTrain: "0.15"
      - id: source-verification
        label: "Source verification"
        repo: walnuthq/miden-source-code-verification
        branch: main
        owner: "Walnut"
        expectedVersion: "0.15"
        group: walnut
        dependsOn: [rust-sdk, web-sdk]
        detectors:
          - type: cargo-dep
            path: apps/api-compile/crates/miden-verifier/Cargo.toml
            dependency: miden-client
            provesComponent: rust-sdk
            targetTrain: "0.15"
          - type: npm-dep
            path: apps/web-verifier/package.json
            dependency: "@miden-sdk/miden-sdk"
            provesComponent: web-sdk
            targetTrain: "0.15"

  # ---- Current release train. ----
  - name: "Miden v0.16"
    targetVersion: "0.16"
    targetDate: null
    components:
      - id: vm
        label: "Miden VM"
        repo: 0xMiden/miden-vm
        branch: next
        owner: "VM team"
        expectedVersion: "0.29.0" # protocol 0.16 consumes the VM 0.29 train (0.30 was never adopted)
        group: chain
        detectors:
          - type: github-release
      - id: protocol
        label: "Protocol"
        repo: 0xMiden/protocol
        branch: release/v0.16.0-rc
        owner: "Protocol team"
        expectedVersion: "0.16.0"
        group: chain
        dependsOn: [vm]
        detectors:
          - type: github-release
          - type: cargo-dep
            dependency: miden-core
            provesComponent: vm
            targetTrain: "0.29"
      - id: node
        label: "Node"
        repo: 0xMiden/node
        branch: next
        owner: "Node team"
        expectedVersion: "0.16.0"
        group: chain
        dependsOn: [protocol]
        detectors:
          - type: github-release
          - type: cargo-dep
            dependency: miden-protocol
            provesComponent: protocol
      - id: rust-sdk
        label: "Rust SDK"
        repo: 0xMiden/rust-sdk
        branch: next
        owner: "Wiktor"
        expectedVersion: "0.16.0"
        group: sdk
        dependsOn: [protocol, node]
        detectors:
          - type: github-release
          - type: cargo-dep
            dependency: miden-protocol
            provesComponent: protocol
          # The only node edge: the build-time proto crate.
          - type: cargo-dep
            dependency: miden-node-proto-build
            provesComponent: node
      - id: web-sdk
        label: "Web SDK"
        repo: 0xMiden/web-sdk
        branch: next
        owner: "Wiktor"
        expectedVersion: "0.16.0"
        group: sdk
        dependsOn: [protocol, node]
        detectors:
          - type: github-release
          - type: cargo-dep
            dependency: miden-client
            provesComponent: rust-sdk
      - id: guardian
        label: "Guardian"
        repo: OpenZeppelin/guardian
        branch: main
        owner: "OpenZeppelin"
        expectedVersion: "0.17.0" # Guardian runs its own version train
        group: app
        dependsOn: [rust-sdk, web-sdk]
        detectors:
          - type: github-release
          - type: cargo-dep
            dependency: miden-protocol
            provesComponent: protocol
          - type: npm-dep
            path: packages/miden-multisig-client/package.json
            dependency: "@miden-sdk/miden-sdk"
            provesComponent: web-sdk
      - id: wallet
        label: "Wallet"
        repo: 0xMiden/wallet
        branch: next
        owner: "Wiktor"
        expectedVersion: "1.16.0" # wallet versions as 1.x
        group: app
        dependsOn: [web-sdk, guardian]
        detectors:
          - type: github-release
          - type: npm-dep
            dependency: "@miden-sdk/miden-sdk"
            provesComponent: web-sdk
          - type: npm-dep
            dependency: "@openzeppelin/guardian-client"
            provesComponent: guardian
            targetTrain: "0.17"
      - id: docs
        label: "Docs"
        repo: 0xMiden/docs
        branch: main
        owner: "Brian"
        expectedVersion: "0.16"
        group: devex
        dependsOn: [rust-sdk, web-sdk]
        detectors:
          - type: yaml-manifest
            path: .release/release-manifest.yml
            key: next_version
      - id: tutorials
        label: "Tutorials"
        repo: 0xMiden/tutorials
        branch: main
        owner: "Philipp"
        expectedVersion: "0.16"
        group: devex
        dependsOn: [rust-sdk, web-sdk]
        detectors:
          - type: cargo-dep
            path: rust-client/Cargo.toml
            dependency: miden-client
            provesComponent: rust-sdk
          - type: npm-dep
            path: web-client/package.json
            dependency: "@miden-sdk/miden-sdk"
            provesComponent: web-sdk
      - id: frontend-template
        label: "Frontend template"
        repo: 0xMiden/frontend-template
        branch: main
        owner: "Philipp"
        expectedVersion: "0.16"
        group: devex
        dependsOn: [web-sdk]
        detectors:
          - type: npm-dep
            dependency: "@miden-sdk/miden-sdk"
            provesComponent: web-sdk
      - id: project-template
        label: "Project template"
        repo: 0xMiden/project-template
        branch: main
        owner: "Roman"
        expectedVersion: "0.16"
        group: devex
        dependsOn: [rust-sdk]
        detectors:
          # Root Cargo.toml has an empty [workspace.dependencies]; the real
          # pins live in the integration crate.
          - type: cargo-dep
            path: integration/Cargo.toml
            dependency: miden-client
            provesComponent: rust-sdk
      - id: agentic-template
        label: "Agentic template"
        repo: 0xMiden/agentic-template
        branch: main
        owner: "Philipp"
        expectedVersion: "0.16"
        group: devex
        dependsOn: [frontend-template, project-template]
        detectors:
          # The repo is two git submodules; each detector resolves the pinned
          # commit and reads the SDK dependency at that commit — automated.
          - type: submodule-dep
            submodulePath: frontend-template
            sourceRepo: 0xMiden/frontend-template
            manifest: npm
            path: package.json
            dependency: "@miden-sdk/miden-sdk"
            provesComponent: web-sdk
          - type: submodule-dep
            submodulePath: project-template
            sourceRepo: 0xMiden/project-template
            manifest: cargo
            path: integration/Cargo.toml
            dependency: miden-client
            provesComponent: rust-sdk
      - id: midenup
        label: "midenup"
        repo: 0xMiden/midenup
        branch: main
        owner: "Roman"
        expectedVersion: "0.16"
        group: devex
        dependsOn: [rust-sdk, node]
        detectors:
          - type: midenup-channel
            channel: "0.16.0"
            component: client
            provesComponent: rust-sdk
          - type: midenup-channel
            channel: "0.16.0"
            component: node
            provesComponent: node

      # ---- Walnut surfaces (rolled up into one stage in the UI). No releases
      # or tags on these repos; version comes from manifests on main. NOTE:
      # never infer the Miden train from @openzeppelin/miden-multisig-client —
      # it is versioned independently (0.16.x while the SDK sat on 0.15).
      - id: playground
        label: "Playground"
        repo: walnuthq/miden-playground
        branch: main
        owner: "Walnut"
        expectedVersion: "0.16"
        group: walnut
        dependsOn: [web-sdk]
        detectors:
          - type: npm-dep
            path: apps/web/package.json
            dependency: "@miden-sdk/miden-sdk"
            provesComponent: web-sdk
          - type: migration-pr
            number: 633
      - id: source-verification
        label: "Source verification"
        repo: walnuthq/miden-source-code-verification
        branch: main
        owner: "Walnut"
        expectedVersion: "0.16"
        group: walnut
        dependsOn: [rust-sdk, web-sdk]
        detectors:
          - type: cargo-dep
            path: apps/api-compile/crates/miden-verifier/Cargo.toml
            dependency: miden-client
            provesComponent: rust-sdk
          - type: npm-dep
            path: apps/web-verifier/package.json
            dependency: "@miden-sdk/miden-sdk"
            provesComponent: web-sdk
          - type: migration-pr
            number: 22

